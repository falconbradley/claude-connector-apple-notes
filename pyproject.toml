[project]
name = "apple-notes-mcp"
version = "0.6.0"
description = "MCP server for Apple Notes on macOS — fast local-store reads, native-scripting writes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
apple-notes-mcp = "apple_notes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_notes_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
